name: On Push Tags

on:
  push:
    tags:
      - "*.*.*"

jobs:
  check-tag-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Tag Format
        run: |
          tag="${{ github.ref_name }}"
          echo "Validating tag: $tag"

          # Check if tag matches vMAJOR.MINOR.PATCH format
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$tag' does not match the expected format"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            echo "Examples of valid tags: v1.0.0, v2.3.4, v10.20.30"
            exit 1
          fi

          echo "Tag format is valid: $tag"
  validate-version:
    needs: [check-tag-format]
    uses: ./.github/workflows/validate-version-workflow-call.yaml
    with:
      git-ref: ${{ github.ref }}
    permissions:
      contents: read
  update-version:
    needs: [validate-version]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Update Tags
        run: |
          # Get the latest tag
          export tag=$(git describe --tags --abbrev=0)
          export branch="bot/update-version-to-$tag"
          git checkout -b $branch

          # Update the version in __init__.py
          line_before_chg=$(grep -P "__version__ *= *['|\"]v?\d+\.\d+\.\d+.*['|\"]" pyjpboatrace/__init__.py)
          line_after_chg="__version__ = '$tag'"
          echo "line_before_chg: $line_before_chg"
          echo "line_after_chg: $line_after_chg"
          sed -i "s;$line_before_chg;$line_after_chg;g" pyjpboatrace/__init__.py

          # Output the tag and branch
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "branch=$branch" >> "$GITHUB_ENV"

          # Commit and push the changes
          if [ $(grep "$line_after_chg" pyjpboatrace/__init__.py | wc -l) -eq 1 ]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyjpboatrace/__init__.py
            git commit -m "Update Version to $tag"
            msg=$(git tag -n $tag)
            git tag -d $tag
            git tag -a $tag -m "$msg automatically created by GitHub Actions"
            git push --delete origin $tag
            git push -u origin $tag
            git push -u origin $branch
          else
            echo "Failed to update version"
            exit 1
          fi
      - name: Create Pull Request
        shell: bash
        run: |
          gh pr create \
            --title "Update Version to $tag" \
            --body "Update Version to $tag" \
            --base main \
            --head $branch \
            --assignee hmasdev \
            --reviewer hmasdev \
            --label "bot"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create a Draft Release
        shell: bash
        run: |
          gh release create $tag --title "Release $tag" --notes "Release $tag" --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
